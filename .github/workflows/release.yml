name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (for example v1.0.1)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the release
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: vendor/scc-source/go.mod
          cache: false

      - name: Install Inno Setup
        shell: pwsh
        run: winget install --id JRSoftware.InnoSetup --exact --scope user --silent --accept-package-agreements --accept-source-agreements --disable-interactivity

      - name: Build the bundled engine
        shell: pwsh
        run: ./build/build-backend.ps1

      - name: Restore (locked)
        run: dotnet restore CodeScope.sln --locked-mode

      - name: Build
        run: dotnet build CodeScope.sln -c Release --no-restore

      - name: Test
        run: dotnet run --project tests/CodeScope.Tests -c Release --no-build

      # The installer: it checks for the .NET 8 desktop runtime and can add it
      # from the copy inside the setup when the machine does not have it.
      - name: Build the installer
        shell: pwsh
        run: ./build/build-installer.ps1 -OutputDir "${{ github.workspace }}/release-files"

      # The large build: it carries the runtime, so it runs on a clean machine.
      - name: Publish with the runtime included
        shell: pwsh
        run: ./build/publish.ps1 -SelfContained

      - name: Collect the release files
        shell: pwsh
        run: |
          Copy-Item release-files/CodeScope-Setup.exe .
          Copy-Item release-files/CodeScope-portable.zip .
          Compress-Archive -Path publish/CodeScope/* -DestinationPath CodeScope-windows-x64-self-contained.zip

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}
          files: |
            CodeScope-Setup.exe
            CodeScope-portable.zip
            CodeScope-windows-x64-self-contained.zip
